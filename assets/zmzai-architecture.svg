<svg xmlns="http://www.w3.org/2000/svg" width="840" height="454" viewBox="0 0 840 454" role="img" aria-labelledby="t d">
  <title id="t">zmzai 系统架构</title>
  <desc id="d">一套内核 @zmzai/agent-framework 装配成两个运行面：云端的 zmzai-agent 与桌面端的 Lectern，两者都经 Relay 推理。执行落在两条边界之一：云端 Sandbox 容器，或用户本机。共享底座为 Auth、theme、db、contracts。</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.5 L7.5 4 L0.5 7.5 Z" fill="#16181C"/>
    </marker>
    <style>
      .s { font-family:'MiSans',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif; }
      .m { font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; }
      .ink { fill:#16181C; }
      .ink2 { fill:#4E535D; }
      .ink3 { fill:#81858E; }
      .dk { fill:#F4F5F6; }
      .k { font-size:12px; font-weight:500; letter-spacing:0.02em; }
      .b { font-size:14px; font-weight:400; }
      .t { font-size:17px; font-weight:600; }
      .box { fill:#FFFFFF; stroke:#16181C; stroke-width:1.25; }
      .a { fill:none; stroke:#16181C; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="840" height="454" fill="#FFFFFF"/>
  <rect width="840" height="6" fill="#16181C"/>

  <!-- masthead: brand lockup (cloud mark + ZMZAI wordmark) -->
  <image x="28" y="22" width="34" height="34" href="data:image/png;base64,"/>
  <text x="72" y="48" class="s ink" font-size="25" font-weight="600" letter-spacing="-0.5">ZMZAI</text>
  <text x="812" y="34" text-anchor="end" class="m ink2" font-size="12" letter-spacing="0.7">ARCHITECTURE · 系统架构</text>
  <text x="812" y="56" text-anchor="end" class="s ink" font-size="14" font-weight="500">一套内核 · 两个运行面 · 两条执行边界</text>

  <!-- kernel: one band spanning both surfaces -->
  <rect y="80" width="840" height="56" fill="#16181C"/>
  <rect y="80" width="5" height="56" fill="#FF00A8"/>
  <text x="28" y="102" class="m" fill="#FF42BB" font-size="12" letter-spacing="1">KERNEL · 内核</text>
  <text x="28" y="126" class="s dk" font-size="17" font-weight="600">@zmzai/agent-framework</text>
  <text x="812" y="105" text-anchor="end" class="m dk" font-size="14">sessions · permissions · tools</text>
  <text x="812" y="125" text-anchor="end" class="m dk" font-size="14">events · subagents · runner</text>

  <!-- kernel is assembled into each surface -->
  <line x1="150" y1="136" x2="150" y2="171" class="a" marker-end="url(#ar)"/>
  <line x1="732" y1="136" x2="732" y2="171" class="a" marker-end="url(#ar)"/>

  <!-- zone: cloud -->
  <rect x="28" y="140" width="492" height="250" fill="#F4F4F6"/>
  <g fill="none" stroke="#4E535D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(46 142) scale(0.6)">
    <rect x="2" y="2" width="20" height="8" rx="2"/>
    <rect x="2" y="14" width="20" height="8" rx="2"/>
    <line x1="6" y1="6" x2="6.01" y2="6"/>
    <line x1="6" y1="18" x2="6.01" y2="18"/>
  </g>
  <text x="66" y="154" class="s ink2 k" letter-spacing="0.7">云端 CLOUD</text>

  <!-- zone: device -->
  <g fill="none" stroke="#4E535D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(552 142) scale(0.6)">
    <rect x="4" y="4" width="16" height="11" rx="1.5"/>
    <path d="M2 19h20"/>
  </g>
  <text x="572" y="154" class="s ink2 k" letter-spacing="0.7">你的设备 DEVICE</text>

  <!-- surface: cloud -->
  <rect data-box="agent" x="46" y="172" width="208" height="96" rx="4" class="box"/>
  <g data-in="agent">
    <text x="62" y="193" class="s ink2 k">运行面 · 云端</text>
    <text x="62" y="217" class="s ink t">zmzai-agent</text>
    <text x="62" y="238" class="s ink2 b">Mongo workspace</text>
    <text x="62" y="256" class="s ink2 b">skills · memory · 审批</text>
  </g>

  <!-- platform: model access -->
  <rect data-box="relay" x="290" y="172" width="212" height="96" rx="4" class="box"/>
  <g data-in="relay">
    <text x="306" y="193" class="s ink2 k">模型接入</text>
    <text x="306" y="217" class="s ink t">Relay</text>
    <rect x="366" y="203" width="44" height="20" rx="10" fill="#FFFFFF" stroke="#16181C"/>
    <text x="388" y="217" text-anchor="middle" class="s ink" font-size="12" font-weight="500">开源</text>
    <text x="306" y="238" class="s ink2 b">OpenAI 兼容 · 多渠道路由</text>
    <text x="306" y="256" class="s ink2 b">按 token 计费</text>
  </g>

  <!-- surface: device (flagship) -->
  <rect data-box="lectern" x="552" y="172" width="260" height="96" rx="4" fill="#16181C"/>
  <g data-in="lectern">
    <text x="568" y="193" class="s ink3 k">运行面 · 桌面</text>
    <text x="568" y="217" class="s dk t">Lectern</text>
    <text x="568" y="238" class="s dk b">云端推理 · 本机执行</text>
    <text x="568" y="256" class="s dk b">terminal · checkpoints</text>
  </g>

  <!-- execution boundary A: cloud container -->
  <rect data-box="sandbox" x="46" y="300" width="208" height="76" rx="4" class="box"/>
  <g data-in="sandbox">
    <text x="62" y="321" class="s ink2 k">执行边界 A</text>
    <text x="62" y="344" class="s ink t">Sandbox</text>
    <text x="62" y="363" class="s ink2 b">云端容器 · 受限代码执行</text>
  </g>

  <!-- long-term memory -->
  <rect data-box="memory" x="290" y="300" width="212" height="76" rx="4" class="box"/>
  <g data-in="memory">
    <text x="306" y="321" class="s ink2 k">长期记忆</text>
    <text x="306" y="344" class="s ink t">Memory</text>
    <text x="306" y="363" class="s ink2 b">召回注入 · 候选提炼待审</text>
  </g>

  <!-- execution boundary B: the user's machine -->
  <rect data-box="local" x="580" y="300" width="232" height="76" rx="4" class="box"/>
  <g data-in="local">
    <text x="596" y="321" class="s ink2 k">执行边界 B</text>
    <text x="596" y="344" class="s ink t">本机沙箱</text>
    <text x="596" y="363" class="s ink2 b">文件 · 终端 · git · audit.db</text>
  </g>

  <!-- flows -->
  <line x1="254" y1="218" x2="289" y2="218" class="a" marker-end="url(#ar)"/>
  <text x="272" y="210" text-anchor="middle" class="s ink2 k">推理</text>

  <line x1="552" y1="218" x2="503" y2="218" class="a" marker-end="url(#ar)"/>
  <text x="527" y="210" text-anchor="middle" class="s ink2 k">推理</text>

  <line x1="150" y1="268" x2="150" y2="299" class="a" marker-end="url(#ar)"/>
  <text x="160" y="288" class="s ink2 k">容器执行</text>

  <path d="M564 268 V336 H503" class="a" marker-end="url(#ar)"/>
  <text x="508" y="328" class="s ink2 k">记忆召回</text>

  <line x1="696" y1="268" x2="696" y2="299" class="a" marker-end="url(#ar)"/>
  <text x="706" y="288" class="s ink2 k">本机执行</text>

  <!-- shared foundation -->
  <line x1="28" y1="406" x2="812" y2="406" stroke="#E3E4E7"/>
  <text x="28" y="430" class="s ink2 k" letter-spacing="0.7">共享底座</text>
  <text x="110" y="430" class="s ink2 b">Auth 单点登录 · @zmzai/theme · zmzai-db · zmzai-contracts</text>
  <text x="812" y="430" text-anchor="end" class="m ink2" font-size="12">zmzai.cloud</text>

</svg>
